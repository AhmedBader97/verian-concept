# Notes from importing Verian's public library (veriangroup.com, 19 October 2026).
# Each note says what was found on the source site and what the pipeline did about it.
# build.py copies these into src/data/quality.json under "sourceNotes".

- found: Two case-study pages tell the same story under different addresses (/case-studies/tourism-new-zealand and /case-studies/tiakicampaign).
  action: Kept one item (tourism-new-zealand) so the story is not counted or cited twice.
  items: [tourism-new-zealand]

- found: The Behavioural & Communications tag page links one case study with a malformed address that repeats its path (veriangroup.com/case-studies/veriangroup.com/case-studies/reducing-water-consumption-england).
  action: Linked the item to its working address.
  items: [reducing-water-consumption-england]

- found: Fourteen case studies appear only on topic tag pages, not in the main case-study listing as paged through for this import.
  action: Imported them from the tag pages, with the dates shown there.

- found: Paging further through News and insights returns the latest articles again, so older articles are reachable only through topic tags.
  action: Rebuilt the archive from every topic tag page and removed duplicates by address.

- found: Many items carry no topic tag at all, so they never appear when someone browses by topic.
  action: Kept them searchable by text and counted them in the quality report.

- found: '"How prepared do we think we are?" is listed under 24 February 2026, but its byline reads 24 February 2025, and it refers to a managing director appointed in January 2026.'
  action: Used the listing date, which the content supports.
  items: [how-prepared-do-we-think-we-are]

- found: The child poverty case study names the Ministry of Justice in its page metadata, while its text says the Department for Work and Pensions commissioned the work.
  action: Followed the text of the page.
  items: [parents-and-carers-forum-informing-the-new-child-poverty-strategy]

- found: Two items are published under nested locale paths inside the global section (for example /case-studies/en-gb/case-studies/...), so one page has several addresses.
  action: Kept the address used by the global listing.
  items: [parents-and-carers-forum-informing-the-new-child-poverty-strategy, verian-appoints-melanie-wiese-as-managing-director-australia]

- found: Tag pages show a "No Posts Found" message underneath their results.
  action: None needed; noted because it can make a populated topic look empty.
