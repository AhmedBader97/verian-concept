<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Schibsted"; src: url("../../node_modules/@fontsource-variable/schibsted-grotesk/files/schibsted-grotesk-latin-wght-normal.woff2") format("woff2-variations"); font-weight: 400 900; }
  @font-face { font-family: "Spectral"; src: url("../../node_modules/@fontsource/spectral/files/spectral-latin-400-normal.woff2") format("woff2"); }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #f1f3f2; color: #16202b; font-family: "Schibsted", sans-serif; position: relative; overflow: hidden; }
  .copy { position: absolute; left: 72px; top: 70px; width: 600px; }
  .brand { font-size: 26px; font-weight: 640; letter-spacing: -0.03em; display: flex; gap: 12px; align-items: baseline; }
  .brand span { font-size: 16px; font-weight: 450; color: #5f6a75; padding-left: 12px; border-left: 1px solid #a3adb3; }
  h1 { font-size: 76px; line-height: 0.98; letter-spacing: -0.035em; font-weight: 560; margin: 56px 0 28px; }
  p { font-family: "Spectral", serif; font-size: 25px; line-height: 1.45; color: #44505c; margin: 0; max-width: 520px; }
  .by { position: absolute; left: 72px; bottom: 56px; display: flex; gap: 10px; align-items: center; background: #16202b; color: #fafbfa; border-radius: 999px; padding: 10px 18px 10px 14px; font-size: 18px; }
  svg { position: absolute; right: 40px; top: 60px; }
</style></head>
<body>
  <div class="copy">
    <div class="brand">Verian <span>concept</span></div>
    <h1>Powering decisions that shape the world.</h1>
    <p>A redesign with research AI that cites every claim, says when evidence is thin, and asks before anything leaves.</p>
  </div>
  <div class="by"><svg width="20" height="18" viewBox="0 0 20 18" style="position:static"><circle cx="10" cy="3" r="2.4" fill="#e09a2b"/><circle cx="3" cy="15" r="2.4" fill="#2d55c8"/><circle cx="17" cy="15" r="2.4" fill="#12877a"/></svg>Unofficial concept by Ahmed Bader</div>
  <svg id="field" width="520" height="500"></svg>
  <script>
    // Same idea as the site's hero: a ternary field coloured by its mix.
    let a = 20231109;
    const rnd = () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    const gamma = (k) => { if (k < 1) return gamma(k + 1) * Math.pow(rnd(), 1 / k); const d = k - 1/3, c = 1 / Math.sqrt(9 * d); for (;;) { let x, v; do { x = gauss(); v = 1 + c * x; } while (v <= 0); v = v*v*v; const u = rnd(); if (u < 1 - 0.0331 * x**4) return d * v; if (Math.log(u) < 0.5*x*x + d*(1 - v + Math.log(v))) return d * v; } };
    const dir = (al) => { const g = al.map(gamma), s = g[0] + g[1] + g[2]; return g.map((x) => x / s); };
    const hex = (h) => [1,3,5].map((i) => parseInt(h.slice(i, i+2), 16) / 255);
    const lin = (c) => c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4, srgb = (c) => c <= 0.0031308 ? 12.92 * c : 1.055 * c ** (1/2.4) - 0.055;
    const toLab = ([r,g,b]) => { r=lin(r); g=lin(g); b=lin(b); const l=Math.cbrt(0.4122214708*r+0.5363325363*g+0.0514459929*b), m=Math.cbrt(0.2119034982*r+0.6806995451*g+0.1073969566*b), s=Math.cbrt(0.0883024619*r+0.2817188376*g+0.6299787005*b); return [0.2104542553*l+0.793617785*m-0.0040720468*s, 1.9779984951*l-2.428592205*m+0.4505937099*s, 0.0259040371*l+0.7827717662*m-0.808675766*s]; };
    const fromLab = ([L,A,B]) => { const l=(L+0.3963377774*A+0.2158037573*B)**3, m=(L-0.1055613458*A-0.0638541728*B)**3, s=(L-0.0894841775*A-1.291485548*B)**3; return [4.0767416621*l-3.3077115913*m+0.2309699292*s, -1.2684380046*l+2.6097574011*m-0.3413193965*s, -0.0041960863*l-0.7034186147*m+1.707614701*s].map((c) => Math.round(Math.min(1, Math.max(0, srgb(c))) * 255)); };
    const labs = ["#2d55c8", "#12877a", "#e09a2b"].map((h) => toLab(hex(h)));
    const side = 470, h = side * 0.866, cx = 260, cy = 290;
    const A = [cx - side/2, cy + h/3], B = [cx + side/2, cy + h/3], C = [cx, cy - 2*h/3];
    const mix = [[0.4,[2.4,2.4,2.4]],[0.2,[7,1.6,1.3]],[0.2,[1.3,7,1.6]],[0.2,[1.6,1.3,7]]];
    let out = "";
    for (let i = 0; i < 5200; i++) {
      let u = rnd(), k = 0; while (k < 3 && u > mix[k][0]) { u -= mix[k][0]; k++; }
      const [p, q, r] = dir(mix[k][1]);
      const x = p*A[0] + q*B[0] + r*C[0], y = p*A[1] + q*B[1] + r*C[1];
      const col = fromLab([0,1,2].map((j) => labs[0][j]*p + labs[1][j]*q + labs[2][j]*r));
      out += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(1.1 + rnd()*0.6).toFixed(2)}" fill="rgb(${col})"/>`;
    }
    document.getElementById("field").innerHTML = out;
  </script>
</body></html>
